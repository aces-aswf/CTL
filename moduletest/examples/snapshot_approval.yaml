version: 1
suite: snapshot_approval_example
#
# Snapshot / approval testing: the first run records the CTL function's
# outputs to a YAML file, and every subsequent run compares against that
# recording. Use this when the reference answer is:
#   - too numerous to author by hand (large LUT, many struct fields)
#   - load-bearing but not yet spec-defined (you trust the current code)
#   - easier to diff on PR review than to re-derive
#
# Three gates protect the snapshot file from accidental overwrites:
#   1. Env:       CTL_TEST_UPDATE_SNAPSHOTS=1 (or =force to overwrite existing)
#                 equivalently: ctltest --update-snapshots[=force]
#   2. Per-test:  `writable: true` on the oracle.snapshot block
#   3. First run: CTL_TEST_ALLOW_NEW_SNAPSHOTS=1 (or --allow-new-snapshots)
#                 required the *first* time a snapshot is recorded, so CI
#                 can't silently green a test that has never seen its
#                 expected outputs recorded anywhere.
#
# Typical workflow:
#   ctltest --update-snapshots --allow-new-snapshots my_suite.yaml   # bootstrap
#   ctltest my_suite.yaml                                              # daily CI
#   ctltest --update-snapshots=force my_suite.yaml                     # intentional reset
#

modules:
  - mymodule
module_paths:
  - .

defaults:
  tolerance:
    abs: 1.0e-6

tests:
  - id: lut_1024_approx
    description: |
      Approval-gate a 1024-entry interpolation LUT. The first run
      requires `--allow-new-snapshots`; after that any drift will fail
      the test with a path-level diff.
    function: mymodule::build_lut_1024
    inputs:
      n_entries: 1024
      mode: "gamma-2.2"
    oracle:
      snapshot:
        path: snapshots/lut_1024_approx.yaml
        writable: true

  - id: struct_of_coefficients
    description: Approval-gate a struct of 30+ tonescale coefficients.
    function: mymodule::tonescale_coefficients
    inputs:
      peak_nits: 100.0
      flare: 0.01
    oracle:
      snapshot:
        path: snapshots/tonescale_coefficients.yaml
        writable: true

  # A snapshot test that is INTENTIONALLY read-only: `writable: false` (the
  # default). Even with the env var set, this file is never rewritten. Use
  # this when you want the snapshot to be a stable reference across runs.
  - id: frozen_reference
    description: Read-only snapshot; not regenerated by --update-snapshots.
    function: mymodule::frozen_constants
    oracle:
      snapshot:
        path: snapshots/frozen_constants.yaml
        writable: false
